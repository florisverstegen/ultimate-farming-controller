; Ultimate Farming Controller
; Raspberry Pi Pico met de Arduino-Pico core (Earle Philhower)

[platformio]
default_envs = pico

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200

; Raspberry Pi Pico (RP2040)
[env:pico]
board = rpipico

; Raspberry Pi Pico 2 (RP2350) - gebruik met: pio run -e pico2
[env:pico2]
board = rpipico2
